services:
  - type: web
    name: codesure-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: DATABASE_URL
        fromDatabase:
          name: codesure-postgres
          property: connectionString

databases:
  - name: codesure-postgres
    databaseName: codesure
    user: postgres
    plan: free
    region: oregon
